services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anni
      POSTGRES_USER: anni
      POSTGRES_PASSWORD: anni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anni -d anni"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/anni
      DB_USER: anni
      DB_PASSWORD: anni
    ports:
      - "8080:8080"

volumes:
  pgdata:
