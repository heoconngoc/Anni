server:
  port: 8080

spring:
  application:
    name: anni-server
  datasource:
    url: jdbc:h2:mem:anni;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/anni}
    username: ${DB_USER:anni}
    password: ${DB_PASSWORD:anni}
